name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: target musl -> binary tĩnh hoàn toàn, chạy mọi distro.
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          # macOS: liên kết động libSystem (static toàn phần không khả thi trên macOS),
          # nhưng không phụ thuộc thư viện bên thứ ba -> self-contained.
          - name: darwin-x64
            os: macos-14
            target: x86_64-apple-darwin
            cross: false
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            cross: false
          # Windows: MSVC + crt-static (xem .cargo/config.toml) -> không cần vcruntime.
          # Chỉ tcp-tcp build được; ba bản *-unix cần Unix domain socket (tokio không
          # hỗ trợ trên Windows) nên bị loại khỏi matrix build của Windows.
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            cross: false
            build_args: "--bin tcp-tcp"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} ${{ matrix.build_args }}
          else
            cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.build_args }}
          fi

      - name: Verify static binary (linux)
        if: startsWith(matrix.name, 'linux')
        shell: bash
        run: |
          out="$(file "target/${{ matrix.target }}/release/tcp-tcp")"
          echo "$out"
          # musl x86_64 mặc định sinh static-pie ("static-pie linked"); aarch64 là
          # "statically linked". Cả hai đều tĩnh hoàn toàn (không phụ thuộc .so).
          echo "$out" | grep -Eq 'statically linked|static-pie linked'
          echo "$out" | grep -q 'dynamically linked' && { echo "::error::binary is dynamically linked"; exit 1; } || true

      - name: Rename binaries (per os-arch, không đóng gói)
        shell: bash
        run: |
          mkdir dist
          for b in tcp-tcp tcp-unix unix-tcp unix-unix; do
            src="target/${{ matrix.target }}/release/${b}${{ matrix.ext }}"
            if [ -f "${src}" ]; then
              cp "${src}" "dist/${b}-${{ matrix.name }}${{ matrix.ext }}"
            fi
          done
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: binaries-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          files="$(ls | grep -v '^checksums.txt$')"
          sha256sum ${files} > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
